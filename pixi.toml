[workspace]
authors = ["DerWeh <andreas.weh@web.de>"]
channels = ["conda-forge"]
name = "BayesianBahn"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Reproduces fdroiddata's merge-request pipeline for our metadata file.
fdroid-check = "tools/fdroid-check.sh"
# Asserts that check still rejects every way the metadata has broken before.
fdroid-self-test = "tools/fdroid-check.sh --self-test"

[dependencies]
gradle = ">=8.10,<9"
openjdk = "21.*"

[feature.pipeline.dependencies]
python = "3.12.*"
polars = "*"
pyarrow = "*"
holidays = ">=0.100,<0.101"
numpy = ">=2.5.1,<3"

[environments]
pipeline = ["pipeline"]
