[workspace]
authors = ["DerWeh <andreas.weh@web.de>"]
channels = ["conda-forge"]
name = "BayesianBahn"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Build, install and launch the debug build on the attached device or emulator.
app = "tools/run-app.sh"
# The pieces, for when only one of them is wanted.
build-app = "./gradlew :app:assembleDebug"
install-app = "./gradlew :app:installDebug"
test-app = "./gradlew :app:testDebugUnitTest"
lint-app = "./gradlew :app:lintDebug"

# Reproduces fdroiddata's merge-request pipeline for our metadata file.
fdroid-check = "tools/fdroid-check.sh"
# Asserts that check still rejects every way the metadata has broken before.
fdroid-self-test = "tools/fdroid-check.sh --self-test"

[dependencies]
gradle = ">=8.10,<9"
openjdk = "21.*"

[feature.pipeline.dependencies]
python = "3.12.*"
polars = "*"
holidays = ">=0.100,<0.101"
numpy = ">=2.5.1,<3"
pytest = ">=8,<9"

[feature.pipeline.tasks]
# The monthly rebuild path runs once a month in production; run it every push.
test-pipeline = "pytest pipeline/tests tools/tests -q"

[feature.evaluate.tasks]
# Needs polars *and* the JDK, so it runs in an environment with both. The driver
# is Python rather than a shell script: pixi's task shell is cross-platform but
# has no loops or conditionals, and the stages need them.
evaluate = "python tools/run_evaluation.py"
# Same run, but the page lands in docs/ for GitHub Pages. Not a CI job: the
# collector runs locally, so only this machine has the data to render.
publish-evaluation = "python tools/run_evaluation.py --publish"
collect = "python tools/collect_forecasts.py run"
collect-status = "python tools/collect_forecasts.py status"

[environments]
# no-default-feature: without it this environment also pulls in gradle and a
# JDK from [dependencies] — 1.4 GB that the data job and its tests never touch.
pipeline = { features = ["pipeline"], no-default-feature = true }
# The evaluation is the one job that needs both toolchains: polars to build the
# events, the JDK to run the shipping model over them.
evaluate = { features = ["pipeline", "evaluate"] }
