# Catch F-Droid metadata problems here instead of on the fdroiddata merge
# request, where every round trip costs a reviewer's attention.
#
# The job runs in debian:trixie-slim and installs fdroidserver the same way
# fdroiddata's pipeline does, so formatting verdicts match bit for bit — the
# YAML library version alone decides where long lines get folded.
#
# The weekly run matters as much as the per-PR one: fdroiddata's CI tracks
# fdroidserver *master*, so a file that is canonical today can stop being
# canonical without us touching it.
name: F-Droid metadata

on:
  push:
    branches: [main]
    paths:
      - fdroid/**
      - tools/fdroid-check.sh
      - app/build.gradle.kts # the metadata restates versionName/versionCode
      - .github/workflows/fdroid-metadata.yml
  pull_request:
    paths:
      - fdroid/**
      - tools/fdroid-check.sh
      - app/build.gradle.kts
      - .github/workflows/fdroid-metadata.yml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      # Before the checkout: without git installed, actions/checkout falls back
      # to a tarball download and the working tree is not a git repository.
      - name: Install fdroidserver
        run: |
          apt-get --allow-releaseinfo-change update
          apt-get -qy dist-upgrade
          apt-get install -qy --no-install-recommends \
            fdroidserver apksigner git curl ca-certificates

      # fetch-depth: 0 for the tags — the check verifies that the commit pinned
      # in the metadata is the one the release tag points at.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The checker has silently stopped checking before, so prove it still
      # rejects each way the metadata has broken in the past.
      - name: Self-test the checker
        env:
          FDROID_SYSTEM_DEPS: "1"
        run: tools/fdroid-check.sh --self-test

      - name: Run fdroiddata's metadata checks
        env:
          FDROID_SYSTEM_DEPS: "1"
        run: tools/fdroid-check.sh --checkupdates --fork
